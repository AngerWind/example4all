<!DOCTYPE html>
<html>
<head>
    <style>
        .grid-container {
            display: grid;
        }
        .grid-container--fill {
            /* 单元格大小必须不固定, 才能提现auto-fill和auto-fit的区别 */
            grid-template-rows: 30px repeat(auto-fill, 100px) 30px;
            background: #2b542c;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 10px;
        }
        .grid-element {
            background-color: deepPink;
            color: #fff;
            border: 1px solid #fff;
        }

    </style>
</head>
<body>
<div class="grid-container grid-container--fill">
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
    <div class="grid-element"> 1 </div>
</div>

</body>
</html>
