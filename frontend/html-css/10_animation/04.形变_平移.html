<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>

        /*
            变形就是指通过CSS来改变元素的形状或位置
            变形不会影响到页面的布局,不会脱离文档流


            transform 可以用来让元素进行平移
                    translateX(100px) 沿着x轴方向平移
                    translateY(100px) 沿着y轴方向平移
                    translateZ(100%) 沿着z轴方向平移, 百分比是相对于自身的大小来计算的
        */
        .box1 {
            background: red;
            height: 100px;
            /* 指定平移需要过渡, 在0.3s内完成 */
            transition: transform 0.3s;
        }
        .box1:hover {
            /* 鼠标悬浮, 向上移动5px */
            transform: translateY(-5px);
        }

    </style>
</head>
<body>
    <div class="box1">鼠标悬浮, 上移</div>
</body>
</html>
