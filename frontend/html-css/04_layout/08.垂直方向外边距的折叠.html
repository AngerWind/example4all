<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .box1,
        .box2 {
            width: 200px;
            height: 200px;
            font-size: 100px;
        }

        .box1 {
            background-color: #bfa;

            /* 设置一个下外边距 */
            margin-bottom: -100px;
            margin-left: auto;
            margin-right: auto;
        }

        .box2 {
            background-color: orange;

            /* 设置一个上外边距 */
            margin-top: 100px;
        }

        .box3 {
            width: 200px;
            height: 200px;
            background-color: #bfa;
        }

        .box4 {
            width: 100px;
            height: 100px;
            background-color: orange;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <!--

     垂直方向的外边距的重叠现象:
                - 垂直方向上, 如果两个兄弟元素的外边距相邻会发生重叠现象(通常是上面元素的下外边框和下面元素的上外边框相邻)
                    如果两个外边距都是正值, 那就会取较大者进行间隔
                    特殊情况: 如果相邻的外边距一正一负，则取两者的和进行间隔或者缩进
                    特殊情况: 如果相邻的外边距都是负值，则取两者中绝对值较大的进行缩进
                 兄弟元素之间的外边距的重叠，对于开发是有利的，所以我们不需要进行处理
     -->
    <!-- 因为box1的下边框是-100px, box2的上边框是100px, 所以最后他们之间的margin是0 -->
    <div class="box1"></div>
    <div class="box2"></div>
    <div>------------------------------------------------------------------------</div>


    <!--
         垂直方向上, 如果没有设置父盒子的上边框和上内间距, 那么第一个子元素的margin-top可能与父元素的margin-top重叠
         直觉上你可能以为, box3 是父盒子, box4 在父盒子内部，距离父盒子顶部 100px
         实际上却是整个父盒子被一起向下推了 100px
         这通常会产生意想不到的布局, 如果想要避免的话, 那么可以
         .box3 {
              display: flow-root;
          }
     -->
    <div class="box3">
        <div class="box4"></div>
    </div>


</body>

</html>
