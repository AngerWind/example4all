<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
    <style>
        .result {
            background: red;
            margin: 20px;
        }
        .result>img {
            /*
               默认情况下，图像被视为行内元素（inline element），而行内元素会有默认的行间距和对齐方式。
               这就会导致图片的下方有一点多余的空白出现, 想要消除这点内容, 可以加上如下的css
             */
            vertical-align: top;
        }

        .container {
            /* 开启flex布局 */
            display: inline-flex;

            background: wheat;

            /* gap用于给子元素设置间距, 他可以用在flex和grid布局中 */
            /* gap是row-gap和column-gap的合并 */
            gap: 12px;
            flex-wrap: wrap; /* 设置换行 */
            align-content: flex-start; /* 设置盒子在多行上向左对齐, 也可以通过center设置为居中对齐 */
            align-items: flex-start; /* 盒子在单行上向左对齐 */
            justify-content: flex-start; /* 盒子向上对齐 */
        }

        .box {
            height: 200px;
            width: 150px;
            background: antiquewhite;
            /* 设置box的边框为圆角 */
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .box:hover {
            transform: translateY(-5px);
        }

        .box>img {
            width: 100%;
            height: 135px;
            /* 消除图片下面的空白 */
            vertical-align: top;
            /* 图片设置为圆角 */
            border-radius: 12px;
        }

        .info {
            /* 文字向左对齐 */
            text-align: start;
        }

        .info h3 {
            font-size: 17px;
            margin: 5px;
        }

        .info p {
            font-size: 14px;
            color: #ff9800;
            font-weight: bold;
            margin: 5px ;
        }
    </style>
</head>
