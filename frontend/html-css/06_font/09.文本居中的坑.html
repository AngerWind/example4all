<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        /*
            问题的说明:
                如果想让一个文本在父元素中水平垂直居中, 我们可以通过text-align: center, vertical-align: center来实现
                但是这样只是让文本在当前行水平和垂直居中, 而不是父元素

                如果想让文本在父元素垂直水平居中, 我们就要让行高等于父元素的行高, 你可能会通过如下方式来实现
                    line-height: 100%
                 当做这样并不能让行高等于父元素的高度, 他只是让行高等于字体大小的100%, 也就是行高等于字体大小
        */

        div {
            text-align: center;
            vertical-align: center;
            height: 100px;
        }
        .box1 {
            background: #2b542c;
            /* 这种方式不能让行高等于父元素的高度, 而是让行高等于字体大小的100% */
            line-height: 100%;
        }
        .box2 {
            background: red;
            /* 如果父元素的大小是固定的, 那么可以直接设置行高为父元素的高度 */
            line-height: 100px;
        }
        .box3 {
            background: yellow;
            /* 直接使用flex布局, 然后让元素垂直和水平居中排列 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box4 {
            background: #1bc4fb;
            /* 直接生成一个只有一个单元格的网格布局, 然后让元素水平垂直居中 */
            display: grid;
            justify-items: center;
            align-items: center;
        }

    </style>
</head>

<body>

<div class="box1">问题的体现</div>
<div class="box2">方式1的居中</div>
<div class="box3">方式2的居中</div>
<div class="box4">方式3的居中</div>

</body>

</html>
