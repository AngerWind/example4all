<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .outer {
            border: 10px red solid;
        }

        .inner {
            width: 100px;
            height: 100px;
            background-color: #bfa;

            /* 
                高度塌陷的问题：
                    我们希望父元素的内容是由子元素撑开的, 这样子元素多一点, 父元素的高度就高一点
                    如果父元素的高度是固定的, 那么子元素少一点, 父元素就会有空白
                    当子元素因为某种情况设置为浮动后(希望子元素能够从左向右摆)，其会完全脱离文档流，子元素从文档流中脱离
                    将会无法撑起父元素的高度，导致父元素的高度丢失
                    父元素高度丢失以后，其下面的元素会自动上移，导致页面的布局混乱
                    所以高度塌陷是浮动布局中比较常见的一个问题，这个问题我们必须要进行处理！
             */
            /* 设置浮动后, inner不会撑开outter的高度 */
            float: left;
        }
    </style>
</head>

<body>

    <div class="outer">

        <div class="inner"></div>

    </div>

</body>

</html>
