<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        /*
                BFC(Block Formatting Context) 块级格式化环境
                - BFC是一个CSS中的一个隐含的属性(不能直接开启, 需要通过特定的css来开启)，可以为一个元素开启BFC
                    开启BFC该元素会变成一个独立的布局区域
                - 元素开启BFC后的特点：
                    1.开启BFC的元素不会被浮动元素所覆盖
                    2.开启BFC的元素子元素和父元素外边距不会重叠
                    3.开启BFC的元素在计算高度的时候, 会将内部的float元素的高度加上

        */
        .box1 {
            width: 200px;
            background-color: #bfa;

            /* 开启 BFC，包住浮动的子元素 */
            display: flow-root;

            /* 不设置固定高度，让子元素撑开 */
        }

        .box3 {
            float: left;
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
    </style>
</head>
<body>

<div class="box1">

    <div class="box3"></div>
</div>

<!-- <div class="box2">

</div> -->

</body>
</html>
