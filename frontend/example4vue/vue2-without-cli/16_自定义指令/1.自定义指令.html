<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>自定义指令</title>
    <script src="../js/vue.js"></script>
</head>
<body>
<!--
   需求1：定义一个v-big-number指令，和v-text功能类似，但会把绑定的数值放大10倍。
   需求2：定义一个v-fbind指令，和v-bind功能类似，但可以让其所绑定的input元素默认获取焦点。
   自定义指令总结：
			一、定义语法：
						(1).局部指令：
							new Vue({directives:{指令名:配置对象} })   或  new Vue({directives: {指令名:回调函数}})
						(2).全局指令：
							Vue.directive(指令名,配置对象) 或  Vue.directive(指令名,回调函数)
							在多个Vue实例中都可以使用
			三、备注：
				         1.指令定义时不加v-，但使用时要加v-；
						 2.指令名如果是多个单词，要使用kebab-case命名方式，不要用camelCase命名。
-->
<div id="root">
    <h2>当前的n值是：<span v-text="n"></span></h2>
    <h2>放大10倍后的n值是: <span v-big="n"></span></h2>
    <button @click="n++">点我n+1</button>
    <p>测试指令函数所调用的时机: {{ name }} </p>
    <hr/>

    <!-- -------------------------------------------------------- -->

    <input type="text" v-fbind:value="n"/>
</div>
<script type="text/javascript">

    const vm = new Vue({
        el:"#root",
        data: {
            name: '上海',
            n:1
        },
        // 在这里定义指定, 这个指定是在vue对象中定义的, 所以只能在这个vue实例中使用, 在其他的vue实例中是不能使用的
        directives:{
            /*
            对于指令, 一共有5个钩子函数
            执行的顺序是 bind -> inserted -> update -> componentUpdated -> unbind
            这些函数会接受到3个参数
               el: 正式的dom元素, 用于直接操作页面的内容
               binding: 指令的使用信息, 可以从他上面获取绑定的值, 参数, 修饰符等等
                        他的结构如下:
                             {
                                 name: 'demo', // 指令的名字, 不包含 v-、参数和修饰符
                                 rawName: 'v-demo:left.red', // 模板中使用的完整指令名称, 包含v-, 修饰符, 通常用于调试，业务代码中较少使用。
                                 value: 20,  // 指令的值
                                 oldValue: undefined, // 上一次指令对的值, 主要在update和componentUpdated中使用, 可以用来判断更新, 可以避免重复更新 DOM
                                 expression: 'n * 10', // 指令的原始表达式,  v-demo="n * 10", 那么指令就是"n * 10"
                                 arg: 'left', // 指令参数，即指令名称后面冒号中的内容, v-demo:left="n", 那么args就是'left'
                                 modifiers: { //指令修饰符组成的对象, v-demo.red.large="n", 那么modifiers就是{ red: true, large: true }
                                   red: true
                                 }
                             }
               vnode: vue生成的虚拟节点, 主要用于读取更底层的组件或者节点信息, 日常比较少用
            */
            // demo:  {
            //     bind(el, binding, vnode) {
            //         // 只调用一次：指令第一次绑定到元素时调用
            //         // 适合用来设置属性, 样式, 注册一次性的事件监听器
            //     },
            //
            //     inserted(el, binding, vnode) {
            //         // 被绑定元素插入父节点时调用
            //         // 适合用来自动聚焦, 读取元素的尺寸, 位置
            //         el.focus()
            //
            //     },
            //
            //     update(el, binding, vnode, oldVnode) {
            //         // 所在组件的 VNode 更新时调用
            //         // 这个函数可以用来更新绑定的元素
            //     },
            //
            //     componentUpdated(el, binding, vnode, oldVnode) {
            //         // 所在组件及其子组件的 VNode 全部更新后调用
            //     },
            //
            //     unbind(el, binding, vnode) {
            //         // 只调用一次：指令与元素解绑时调用
            //         // 如果指令中创建了定时器、事件监听器或第三方插件实例，应该在这里清理，避免内存泄漏。
            //     }
            // },
            fbind:{
                // 一上来, 指令与原生绑定成功的时候, 会调用这个方法
                bind(element, binding){
                    // 接受到指令绑定的element, 他是一个真实dom
                    console.log(element instanceof HTMLElement) // true

                    // 第二个参数是指令的表达式的情况
                    // {
                    //     name: "big-number", // 指令的名字
                    //     rawName: "v-big-number", // 使用时指令的名字
                    //     expression: "n", // 指定绑定的表达式
                    //     value: 99 // 指令绑定的表达式计算后的值
                    // }

                    // 在这里面做的就是, 操作原生dom, 显示自己要的结果
                    element.value = binding.value;

                    // 注意此处 this 是 window, 因为这里面操作的是原生dom, vue不管了
                    console.log(this === window);
                },
                // 当指令所在的元素被插入到页面上时, 会调用这个方法
                inserted(element, binding){
                    element.focus();
                },
                // 如果数据发生了改变, 那么模板会重新解析, 此时会调用这个方法
                update(element, binding){
                    element.value = binding.value;
                }
            },
            'big-number': function(element,binding){
                element.innerText = binding.value * 10;
            },
        }
    });
</script>
</body>
</html>
