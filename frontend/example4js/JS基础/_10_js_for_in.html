<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script type="text/javascript">

        // ============================================
        // for...in 循环 - 遍历对象的属性
        // ============================================

        // 作用：for...in 循环用于遍历对象的可枚举属性
        // 语法：for (变量 in 对象) { }

        // 示例1：遍历普通对象的属性
        var person = {
            name: "张三",
            age: 25,
            gender: "男"
        }

        // 每次循环，key 是对象的属性名（"name", "age", "gender"）
        for (var key in person) {
            console.log("属性名: " + key + ", 属性值: " + person[key])
        }
        // 输出:
        // 属性名: name, 属性值: 张三
        // 属性名: age, 属性值: 25
        // 属性名: gender, 属性值: 男


        // 示例2：遍历数组的下标（不推荐用于数组）
        var fruits = ["苹果", "香蕉", "橙子"]
        for (var index in fruits) {
            console.log("索引: " + index + ", 元素: " + fruits[index])
        }
        // 输出:
        // 索引: 0, 元素: 苹果
        // 索引: 1, 元素: 香蕉
        // 索引: 2, 元素: 橙子
        // 注意：index 是字符串类型 "0", "1", "2"


        // 示例3：遍历字符串的每个字符索引
        var str = "Hello"
        for (var i in str) {
            console.log("索引: " + i + ", 字符: " + str[i])
        }
        // 输出:
        // 索引: 0, 字符: H
        // 索引: 1, 字符: e
        // 索引: 2, 字符: l
        // 索引: 3, 字符: l
        // 索引: 4, 字符: o


        // ============================================
        // for...in 的特点总结
        // ============================================

        // 1. 循环变量获取的是属性名（键），不是值
        // 2. 需要通过 对象[属性名] 来获取对应的值
        // 3. 遍历数组时，索引是字符串类型，不是数字类型
        // 4. !!!!!!!!!会遍历对象自身和原型链上的可枚举属性
        // 5. !!!!!!!!!主要用途是遍历普通对象的属性

    </script>
</head>

</html>
