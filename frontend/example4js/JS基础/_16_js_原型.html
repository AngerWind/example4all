    <script type="text/javascript">

      /**
       * 在JS中, 所有的函数都有一个prototype属性
       * 他是一个Object类型的对象, 这个对象就是所谓的原型对象
       * 同时prototype上面也有一个属性constructor指向函数自身
       */
      function Dog() {}
      console.log(Dog.prototype instanceof Object) // 原型对象是Object类型
      console.log(Dog.prototype.constructor === Dog) // 原型对象身上有一个constructor, 指向函数本身

      /**
       * 如果函数作为普通函数调用, 那么prototype没有任何作用
       * 当函数以构造函数的形式调用时, 他所创建的每个对象中都有一个隐含的属性 __proto__ 指向该构造函数的prototype对象
       */
      function Apple(){}
      const app1 = new Apple();
      const app2 = new Apple();

      console.log(app1.__proto__ === Apple.prototype) // true
      console.log(app2.__proto__ === Apple.prototype) // true
      console.log(app1.__proto__ === app2.__proto__) // true


      /**
       * 同时因为函数也是对象, 所以函数有prototype之外, 也和对象一样有__proto__属性
       * 你可以认为, 一个函数就是一个Function类型的实例, 只是他们的nativeCode不一样而已
       */
      const appleFunction = Apple
      console.log(appleFunction instanceof Function) // true
      console.log(Apple.__proto__ === Function.prototype) // true
      console.log(Dog.__proto__ === Function.prototype) // true


      /**
       * 对于Object函数, 以及他创建出来的object对象, 他们原型指向的是最开始的那个原型
       * 这个最开始的原型也是一个Object类型的对象, 但是他的__proto__是null, 这和其他的Object类型的对象不一样
       */
      console.log(Object.prototype instanceof Object) // true, Object函数的原型是也是Object类型
      console.log(Object.prototype.__proto__ === null) // true, 这个最开始的原型上面没有别的原型了
      const obj1 = {}
      // true, 其他的object的__proto__是有值的,
      // 但是最开始的原型的__proto__是null, 虽然都是Object类型, 但是这是他们的区别
      console.log(obj1.__proto__ === Object.prototype)

  </head>
