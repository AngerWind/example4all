<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script type="text/javascript">

        // ============================================
        // for...of 循环 - 遍历可迭代对象的元素
        // ============================================

        // 作用：for...of 循环用于遍历可迭代对象的元素（数组、字符串、Map、Set等）,
        // !!!!!!!!!!!!!!!for of是通过迭代器来实现的

        // 语法：for (变量 of 可迭代对象) { }

        // 示例1：遍历数组的元素（最常用的方式）
        var fruits = ["苹果", "香蕉", "橙子", "葡萄"]
        for (var fruit of fruits) {
            console.log("水果: " + fruit)
        }
        // 输出:
        // 水果: 苹果
        // 水果: 香蕉
        // 水果: 橙子
        // 水果: 葡萄


        // 示例2：遍历字符串的每个字符
        var str = "Hello"
        for (var char of str) {
            console.log("字符: " + char)
        }
        // 输出:
        // 字符: H
        // 字符: e
        // 字符: l
        // 字符: l
        // 字符: o


        // 示例3：遍历Map对象
        var map = new Map([
            ["name", "张三"],
            ["age", 25],
            ["job", "工程师"]
        ])
        for (var entry of map) {
            console.log("key: " + entry[0] + ", value: " + entry[1])
        }
        // 输出:
        // key: name, value: 张三
        // key: age, value: 25
        // key: job, value: 工程师


        // 示例4：遍历Set对象
        var set = new Set([1, 2, 3, 4, 5])
        for (var num of set) {
            console.log("数字: " + num)
        }
        // 输出:
        // 数字: 1
        // 数字: 2
        // 数字: 3
        // 数字: 4
        // 数字: 5


        // ============================================
        // for...in vs for...of 对比
        // ============================================

        var arr = ["a", "b", "c"]

        // for...in 遍历的是索引（返回字符串类型）
        console.log("--- for...in ---")
        for (var i in arr) {
            console.log("索引: " + i + ", 类型: " + typeof i)
        }
        // 输出:
        // 索引: 0, 类型: string
        // 索引: 1, 类型: string
        // 索引: 2, 类型: string

        // for...of 遍历的是实际元素值
        console.log("--- for...of ---")
        for (var item of arr) {
            console.log("元素: " + item)
        }
        // 输出:
        // 元素: a
        // 元素: b
        // 元素: c


        // ============================================
        // for...of 的特点总结
        // ============================================

        // 1. 循环变量直接获取元素的值，不是索引
        // 2. 适用于所有可迭代对象：数组、字符串、Map、Set、NodeList等
        // 3. 遍历Map时，每个条目是 [key, value] 形式的数组
        // 4. !!!!!!!!!!!!不能直接遍历普通对象（需要转成其他形式）
        // 5. !!!!!!!!!!!!是 ES6 新增的语法，比传统 for 循环更简洁直观
        // 6. !!!!!!!!!!!推荐用于遍历数组和集合的元素

    </script>
</head>

</html>
