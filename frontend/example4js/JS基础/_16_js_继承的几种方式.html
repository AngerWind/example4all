<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      /**
       * 因为在调用属性的时候, 他会去 __proto__ 上面查找, 所以我们可以通过 __proto__ 来实现继承
       */

      /**
       * 方式1: 原型继承
       */
      function Parent(name) {
        this.name = name
      }
      Parent.prototype.getName = function () {
        return this.name
      }

      // 缺点: 所有Child实例的 __proto__ 都会指向同一个Parent对象, this.name变成了static属性, 所有实例都可以访问
      function Child1(){}
      Child1.prototype = new Parent("zhangsan")
      Child1.prototype.constructor = Child1 // 修正constructor
      console.log(new Child1() instanceof Parent) // true

      /**
       * 方式2: 构造函数继承
       */
      // 使用这种方式, 实际上就是把Parent当做普通函数来用, 而不是当做一个构造函数
      // 在Child2创建对象的时候, 会获得一个this对象, 然后立马把this和name传递到Parent函数中
      // 这样在Parent函数中, 就会执行this.name = name 这个代码, 然后给创建的this添加一个name属性
      // 这样创建出来的child2对象, 实际上只是经过Parent被添加了一个name属性, 实际上这和继承没有半毛钱关系
      // 无法使用instanceof
      function Child2(name){
        Parent.call(this, name)
      }
      console.log(new Child2("zhangsan").getName === undefined); // true
      console.log(new Child2("lisi") instanceof Parent) // false

      /**
       * 方式3: 组合继承
       */
      // 这种方式和方式2类似, 先把Parent当做普通函数, 在Child3中将this传给Parent函数,
      // 然后在Parent函数中执行this.name = name 给创建出来的child3对象添加一个name属性
      // 但是后面的Child3.prototype = new Parent() 又让child3继承了一个Parent对象, 这样会child3对象上面有2个name属性, 尽管其中一个是undefined
      function Child3(name) {
        Parent.call(this, name) // 继承Parent的属性
      }

      Child3.prototype = new Parent() // 继承Parent的方法
      // 修正constructor
      Child3.prototype.constructor = Child3

      /**
       * 方式4: 寄生组合继承
       *
       * 优点: 这种方式就解决了组合继承中的构造函数调用两次，构造函数引用类型共享，以及原型对象上存在多余属性的问题。
       *      是推荐的最合理实现方式（排除ES6的class extends继承哈哈哈）。
       *
       * 缺点: 没啥特别的缺点
       */

      /**
       * 这种继承的方式分为两个部分
       * 第一部分: 继承Parent的属性
       *        首先通过在Child4中调用Parent函数, 并传入this,
       *        这样创建出来的child4就会被执行this.name = name, 然后被扩展出来一个name属性
       * 第二部分, 继承Parent的方法
       *       创建一个新对象，让这个新对象的原型指向 Parent.prototype，然后把这个新对象赋值给 Child4.prototype
       *       new Child4() -> Child4.prototype -> new F() ->  Parent.prototype -> Object.prototype -> null
       *       所以实例可以访问Parent上面的getName方法
       */
      function Child4(name){
        Parent.call(this, name)
      }
      function inherit(child, parent) {
        function F(){}
        F.prototype = parent.prototype // 这一步让F身上, 有Parent身上的getName函数, 因为他们的prototype都是一样的
        var prototype = new F() // new F(), 所以new出来的对象身上也有getName函数了
        prototype.constructor = child
        child.prototype = prototype // 设置Child的prototype, 所以new出来的child也有getName函数了
      }


      inherit(Child4, Parent)

      /**
       * 方式5:  使用ES6中的 extends关键字
       */
      class Child5 extends Parent {
        constructor() {
          // 这里很重要，如果在this.topic = 'fe'后面调用，会导致this为undefined，具体原因可以详细了解ES6的class相关内容，这里不展开说明
          super()
          this.topic = 'fe'
        }
      }
    </script>
  </head>
</html>
