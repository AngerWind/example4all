<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get 和 set</title>
</head>

<body>
    <script>
        // get 和 set  
        class Person {

            _name;
            _age;

            constructor(name, age) {
                this._name = name;
                this._age = age;
            }

            // 这个方法和name属性会冲突, 所以name属性按照约定设置为 _name
            get name() {
                console.log('get name()执行了！！');
                return this._name;
            }

            set name(value) {
                this._name = value;
            }

            get age() {
                return this._age;
            }

            set age(value) {
                if (value >= 0) {
                    this._age = value
                }
            }
        }

        var person = new Person("zhangsan", 18);
        console.log(person.name); // 这会调用person的name的getter
        person.age = 18; // 这会调用person的age的setter
    </script>
</body>

</html>
